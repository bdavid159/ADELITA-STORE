    const ClientsView = ({ logic, jumpId, setJumpId }) => {
        const [view, setView] = useState('list'); 
        const [activeClient, setActiveClient] = useState(null); 
        const [filter, setFilter] = useState(""); 
        const [statusFilter, setStatusFilter] = useState('all'); 

        const [newName, setNewName] = useState(""); const [newPhone, setNewPhone] = useState(""); 
        const [newCedula, setNewCedula] = useState(""); const [newProvince, setNewProvince] = useState(""); 
        const [newCity, setNewCity] = useState(""); const [newAddress, setNewAddress] = useState(""); 
        const [newAbono, setNewAbono] = useState(""); const [regDate, setRegDate] = useState(getToday()); const [manualId, setManualId] = useState("");
        const [registeredClient, setRegisteredClient] = useState(null);
        const [codeClient, setCodeClient] = useState(null);

        useEffect(() => {
            if (jumpId) {
                const targetClient = logic.clients.find(c => c.id === jumpId);
                if (targetClient) {
                    setActiveClient(targetClient);
                    setView('detail');
                }
                setJumpId(null); 
            }
        }, [jumpId, logic.clients, setJumpId]);

        const suggestedId = useMemo(() => {
            if (!newName.trim()) return "";
            const existingNumbers = logic.clients.map(c => { const match = c.id.match(/\d+/); return match ? parseInt(match[0], 10) : -1; });
            const usedNumbersSet = new Set(existingNumbers);
            let nextNum = 1;
            while (usedNumbersSet.has(nextNum)) { nextNum++; } 
            const paddedNum = String(nextNum).padStart(3, '0');
            const cleanName = newName.trim().toUpperCase();
            const words = cleanName.split(/\s+/);
            let initials = "XX";
            if (words.length >= 2) { initials = words[0][0] + words[1][0]; } 
            else if (words.length === 1 && words[0].length >= 2) { initials = words[0][0] + words[0][1]; } 
            else if (words.length === 1) { initials = words[0][0] + "X"; }
            return `${initials}${paddedNum}`;
        }, [newName, logic.clients]);

        const handleRegister = async () => { 
            if (!newName.trim()) return alert("⚠️ El nombre es obligatorio.");

            const exactIds = logic.clients.map(c => c.id.toLowerCase());
            const existingNumbers = logic.clients.map(c => { const match = c.id.match(/\d+/); return match ? parseInt(match[0], 10) : -1; }).filter(n => n !== -1);
            let finalId = "";

            if (manualId && manualId.trim() !== "") {
                const testId = manualId.trim().toLowerCase();
                if (exactIds.includes(testId)) return alert(`🛑 ERROR: El código "${manualId.toUpperCase()}" ya existe.`);
                const customMatch = manualId.match(/\d+/);
                if (!customMatch) return alert("⚠️ El código manual debe tener letras y un NÚMERO (Ej: AB015)");
                const customNum = parseInt(customMatch[0], 10);
                if (existingNumbers.includes(customNum)) return alert(`🛑 NÚMERO REPETIDO: El número ${customNum} ya está siendo usado por otro cliente. Evita mezclar contabilidad.`);
                finalId = manualId.trim().toUpperCase();
            } else {
                finalId = suggestedId; 
            }

            let res = null;
            try {
                res = await logic.registerClient(newName, newPhone, newCedula, newProvince, newCity, newAddress, newAbono, regDate, finalId);
            } catch (error) {
                alert(`⚠️ ${error.message || 'No se pudo registrar la clienta.'}`);
                return;
            }
            if(res) {
                setRegisteredClient({ id: res, name: newName.trim(), phone: newPhone.trim() });
                setNewName(""); setNewPhone(""); setNewCedula(""); setNewProvince(""); setNewCity(""); setNewAddress(""); setNewAbono(""); setManualId(""); setView('list');
            } 
        };

            const rawClients = logic?.clients || [];
            const prep = [];
            const disp = [];

            rawClients.forEach(client => {
                if (!client || !client.id) return; 
                
                // BLINDAJE DE DATOS: Valores por defecto estrictos para evitar pantalla blanca
                let cycle = { itemsCount: 0, clothingBalance: 0, lastShipmentDate: new Date(0), totalShippingPaid: 0, totalSales: 0, cycleSales: [] };
                try { 
                    const res = logic.getClientCycle(client.id); 
                    if (res) cycle = { ...cycle, ...res }; 
                } catch(e) {}

                let lastMove = new Date(0);
                const safeCycleSales = cycle.cycleSales || [];
                if (safeCycleSales.length > 0) { 
                    const lastSaleDate = safeCycleSales[safeCycleSales.length - 1]?.date;
                    if (lastSaleDate) lastMove = new Date(safeISO(lastSaleDate)); 
                }
                
                const processedClient = { ...client, cycle, lastMove };
                if (client.packageReady === true) disp.push(processedClient);
                else if (cycle.itemsCount > 0) prep.push(processedClient);
            });

            prep.sort((a, b) => b.lastMove - a.lastMove);
            disp.sort((a, b) => { 
                const numA = parseInt(String(a.id).replace(/\D/g, '')) || 0; 
                const numB = parseInt(String(b.id).replace(/\D/g, '')) || 0; 
                return numA - numB; 
            });
            return { prepList: prep, dispatchList: disp };
        }, [logic?.clients, logic?.sales, logic?.payments, logic?.shipments]);

        const balanceRows = useMemo(() => {
            const rows = [];
            (logic?.clients || []).forEach(client => {
                if (!client?.id) return;
                try {
                    const cycle = logic.getClientCycle(client.id);
                    const templateData = buildBalanceTemplateData(client, cycle);
                    if (templateData.amount <= 0.01) return;
                    rows.push({ ...templateData, client, cycle, hasPhone: templateData.phone.length >= 10 });

        const selectAllBalances = () => {
            const validIds = balanceRows.filter(row => row.hasPhone).map(row => row.clientId);
            const allSelected = validIds.length > 0 && validIds.every(id => selectedBalanceIds.includes(id));
            setSelectedBalanceIds(allSelected ? [] : validIds);
        };

        const buildManualBalanceMessage = (row) => {
            const detail = (row.groups || []).map(group => {
                const pieces = group.itemsCount > 0 ? ` · ${group.itemsCount} prenda${group.itemsCount === 1 ? '' : 's'}` : '';
                return `• *${group.label}*${pieces} · $${Number(group.amount || 0).toFixed(2)}`;
            }).join('\n');
            return `Hola ${row.name} 👋\n\n✨ *ACTUALIZACIÓN DE TU COMPRA* ✨\n\n${detail}\n\n👗 *Prendas pendientes:* ${row.itemsCount}\n💰 *Saldo pendiente:* $${row.amount.toFixed(2)}\n\nEste resumen incluye únicamente las prendas pendientes de pago.\n\nGracias por comprar con nosotros 💖`;
        };

        const openManualBalance = (row) => {
            window.open(`https://wa.me/${row.phone}?text=${encodeURIComponent(buildManualBalanceMessage(row))}`, '_blank', 'noopener,noreferrer');
        };

        const sendBalanceBatch = async () => {
            if (selectedBalanceRows.length === 0) return alert('Selecciona al menos una clienta con número de WhatsApp.');
            if (!window.ADELITA_API_URL || !window.auth?.currentUser) {
                return alert('La conexión segura de WhatsApp todavía no está disponible. Inicia sesión nuevamente o usa el botón individual.');
            }
            if (!window.confirm(`Se enviarán ${selectedBalanceRows.length} mensajes por WhatsApp por un total pendiente de $${selectedBalanceTotal.toFixed(2)}. ¿Continuar?`)) return;

            setIsSendingBalances(true);
            setBalanceStatuses(Object.fromEntries(selectedBalanceRows.map(row => [row.clientId, 'sending'])));
            try {
                const idToken = await window.auth.currentUser.getIdToken(true);
                const recipients = selectedBalanceRows.map(row => ({
                        clientId: row.clientId,
                        phone: row.phone,
                        name: row.name,
                        lives: row.lives,
                        itemsCount: row.itemsCount,
                        amount: row.amount
                    }));
                const chunks = [];
                for (let index = 0; index < recipients.length; index += 40) chunks.push(recipients.slice(index, index + 40));
                const results = [];
                for (const chunk of chunks) {
                    const response = await fetch(`${window.ADELITA_API_URL}/api/send-balances`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${idToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ recipients: chunk })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data?.error || `El servidor respondió ${response.status}.`);
                    results.push(...(data?.results || []));
                }
                const nextStatuses = {};
                selectedBalanceRows.forEach(row => { nextStatuses[row.clientId] = 'error'; });
                results.forEach(result => { nextStatuses[result.clientId] = result.ok ? 'sent' : 'error'; });
                setBalanceStatuses(nextStatuses);
                const sentCount = results.filter(result => result.ok).length;
                const failedCount = selectedBalanceRows.length - sentCount;
                alert(failedCount > 0
                    ? `Enviados: ${sentCount}. No enviados: ${failedCount}. Revisa los marcados en rojo.`
                    : `¡Listo! Se enviaron ${sentCount} saldos por WhatsApp. ✅`);
            } catch (error) {
                console.error(error);
                setBalanceStatuses(Object.fromEntries(selectedBalanceRows.map(row => [row.clientId, 'error'])));
                alert(`No fue posible realizar el envío automático: ${error?.message || 'revisa la configuración del servidor y la plantilla de Meta.'}`);
            } finally {
                setIsSendingBalances(false);
            }
        };

        const moveToDispatch = (client) => {
            if (!client || !client.id) return;
            logic.setClients(client.id, { packageReady: true });
        };
        
        const returnToPrep = () => { 
            if (!selectedClient || !selectedClient.id) return; 
            logic.setClients(selectedClient.id, { packageReady: false }); 
            setSelectedClient(null); 
        };

        const finalizeShipment = () => {
            if (!guide || !guide.trim()) return alert("⚠️ Faltan datos: Escribe el número de Guía o recibo.");
            if (!selectedClient || !selectedClient.id) return;
            
            const cycle = logic.getClientCycle(selectedClient.id) || {}; 
            const balanceAtClosing = Number(cycle.clothingBalance) || 0; 
            
            let closeDateISO;
            const todayStr = getToday();
            if (dispatchDate === todayStr) { 
                closeDateISO = new Date().toISOString(); 
            } else { 
                closeDateISO = new Date((dispatchDate || todayStr) + 'T23:59:59').toISOString(); 
            }

            const nextCycleDateISO = new Date(new Date(closeDateISO).getTime() + 1000).toISOString(); 

            // Construcción robusta de la guía con detalle de empaque y bultos
            const safeBultos = parseInt(bultos) || 1;
            const detailStr = packingDetail && packingDetail.trim() ? ` -> ${packingDetail.trim()}` : "";
            const finalGuide = `${guide.trim()} | ${safeBultos} Bulto(s)${detailStr}`;

            const safeDeliveryMethod = selectedClient.deliveryMethod || 'ESTÁNDAR';

            logic.registerShipment(selectedClient.id, finalGuide, safeDeliveryMethod, closeDateISO);
            
            // Arrastre contable seguro
            if (balanceAtClosing > 0.01) {
                logic.addPayment(selectedClient.id, balanceAtClosing, "Saldo a Favor (Arrastre)", nextCycleDateISO, "efectivo");
            } else if (balanceAtClosing < -0.01) {
                logic.addSale(selectedClient.id, "Deuda Ciclo Anterior", Math.abs(balanceAtClosing), nextCycleDateISO, 'me');
            }

            logic.setClients(selectedClient.id, { packageReady: false, confirmShipping: false, forceAccumulate: false });
            alert("✅ Envío Procesado y Ciclo Cerrado."); 
            setSelectedClient(null); 
            setGuide("");
            setPackingDetail("");
            setBultos(1);
        };

        const handlePayWithBalance = (finalShippingCost, shippingPending) => {
             if (!selectedClient || !selectedClient.id) return;
             const cycle = logic.getClientCycle(selectedClient.id) || {};
             const safeClothingBalance = Number(cycle.clothingBalance) || 0;
             const safeLastShipmentDate = cycle.lastShipmentDate || getToday();
             
             if (finalShippingCost <= 0) return alert("Costo final de envío es 0.");
             if (safeClothingBalance < shippingPending) return alert("Saldo de ropa insuficiente para cubrir el envío.");
             
             const dateISO = smartDate(getToday(), safeLastShipmentDate); 
             logic.addPayment(selectedClient.id, -shippingPending, 'Ajuste costo logístico', dateISO, courierBank); 
             logic.addPayment(selectedClient.id, shippingPending, 'Pago Envío', dateISO, courierBank);
             logic.addExpense(`Salida Courier (Saldo) - ${selectedClient.name || 'Cliente'}`, shippingPending, dateISO, 'shipping', courierBank);
             alert(`✅ Pagado con saldo desde ${courierBank}.`); 
        };

        if (selectedClient) {
            const cycle = logic.getClientCycle(selectedClient.id) || { cycleSales: [], itemsCount: 0, clothingBalance: 0, totalShippingPaid: 0, totalSales: 0 };
            const safeClothingBalance = Number(cycle.clothingBalance) || 0;
            const isDebt = safeClothingBalance < -0.01;
            const debtAmount = Math.abs(safeClothingBalance);
            
            let runningPaid = Number(cycle.totalNormalPaid) || 0;
            const PUNTUAL_DAYS = 2;
            const now = new Date();
            let lostPunctuality = false;
            
            const chronoSortedSales = [...(cycle.cycleSales || [])].sort((a,b) => new Date(safeISO(a.date)) - new Date(safeISO(b.date)));
            
            chronoSortedSales.forEach(item => {
                const itemValue = Number(item.value) || 0;
                if (runningPaid >= itemValue - 0.01) { 
                    runningPaid -= itemValue; 
                } else {
                    const diffDays = Math.floor((now - new Date(safeISO(item.date))) / (1000 * 60 * 60 * 24));
                    if (diffDays > PUNTUAL_DAYS) { lostPunctuality = true; }
                }
            });
            const qualifiesForDiscount = !lostPunctuality;

            const shipBase = Number(selectedClient.shippingCost) || 0;
            const shipDiscount = Number(selectedClient.shippingDiscount) || 0;
            const finalShippingCost = Math.max(0, shipBase - shipDiscount);

            const shippingPaid = Number(cycle.totalShippingPaid) || 0;
            const shippingPending = Math.max(0, finalShippingCost - shippingPaid);

            return (
                <div className="h-full flex flex-col bg-slate-100 p-4">
                    <div className="bg-white rounded-3xl shadow-xl flex-1 flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                        <div className={`p-4 border-b-4 flex justify-between items-start ${isDebt ? 'border-red-500 bg-red-50' : 'border-emerald-500 bg-emerald-50'}`}>
                            <div><h2 className="text-3xl font-black text-slate-800">{selectedClient.id}</h2><p className="font-bold text-slate-500 uppercase text-xs">{selectedClient.name || 'Sin Nombre'}</p></div>
                            <button onClick={() => setSelectedClient(null)} className="bg-white p-2 rounded-full shadow text-slate-400 font-bold hover:text-red-500 w-10 h-10 flex items-center justify-center">✕</button>
                        </div>

                        <div className="p-4 flex-1 overflow-y-auto space-y-4">
                            {isDebt ? (<div className="bg-red-100 text-red-700 px-4 py-3 rounded-xl font-bold text-sm border border-red-200 text-center animate-pulse">🛑 ALERTA: DEBE ROPA ${formatMoney(debtAmount)}</div>) : (<div className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl font-bold text-xs border border-emerald-200 text-center">✅ Ropa Pagada (Saldo: {formatMoney(safeClothingBalance)})</div>)}

                            <div className="bg-slate-50 border border-slate-200 p-3 rounded-2xl">
                                <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Destino:</div>
                                <div className="text-sm font-black text-indigo-700 uppercase flex items-center gap-1">📍 {selectedClient.city || 'Ciudad?'} <span className="text-slate-500 font-bold">({selectedClient.province || 'Prov?'})</span></div>
                                <div className="text-xs text-slate-600 mt-1 font-bold">{selectedClient.address || 'Sin dirección registrada'}</div>
                                <div className="text-xs text-slate-500 mt-1 flex items-center gap-1">📞 {selectedClient.phone || 'Sin Teléfono'}</div>
                            </div>

                            <div className={`p-4 rounded-3xl border-2 space-y-3 ${shippingPending>0.01?'border-orange-200 bg-orange-50':'border-slate-200 bg-white'}`}>
                                <div className="flex justify-between items-center"><h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm"><Icon.Box /> Gestión Envío</h3><div className="text-right text-xs"><span className={`font-black text-lg ${shippingPending>0.01?'text-red-500':'text-emerald-500'}`}>-${shippingPending.toFixed(2)}</span></div></div>
                                
                                <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="text-[10px] font-black uppercase text-slate-400">Beneficio Cliente</span>
                                        {qualifiesForDiscount ? 
                                            <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded uppercase font-black tracking-widest flex items-center gap-1">🟢 Aplica Descuento</span> : 
                                            <span className="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded uppercase font-black tracking-widest flex items-center gap-1 animate-pulse">🔴 Pierde Descuento</span>
                                        }
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-2">
                                        <div>
                                            <label className="text-[9px] font-bold text-slate-400 uppercase">Costo Regular</label>
                                            <input type="number" className="w-full p-2 rounded-lg border bg-slate-50 text-xs font-bold text-slate-700" value={selectedClient.shippingCost || ''} onChange={e=>logic.setClients(selectedClient.id, {shippingCost: parseFloat(e.target.value) || 0})} placeholder="$0.00" />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-bold text-emerald-500 uppercase">Descuento</label>
                                            <input type="number" className="w-full p-2 rounded-lg border border-emerald-200 bg-emerald-50 text-xs font-bold text-emerald-700 focus:border-emerald-500 outline-none" value={selectedClient.shippingDiscount || ''} onChange={e=>logic.setClients(selectedClient.id, {shippingDiscount: parseFloat(e.target.value) || 0})} placeholder="$0.00" />
                                        </div>
                                    </div>
                                    <div className="mt-2 pt-2 border-t border-slate-100 flex gap-2">
                                        <input type="text" className="w-1/2 p-2 rounded-lg border bg-slate-50 text-xs font-bold uppercase" value={selectedClient.deliveryMethod || ''} onChange={e=>logic.setClients(selectedClient.id, {deliveryMethod: (e.target.value || '').toUpperCase()})} placeholder="Courier..." />
                                        <div className="w-1/2 bg-slate-800 text-white rounded-lg flex items-center justify-center text-xs font-black shadow-inner">
                                            A COBRAR: ${finalShippingCost.toFixed(2)}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="bg-emerald-50 p-2 rounded-xl border border-emerald-100 flex flex-col gap-2">
                                    <label className="text-[10px] font-bold text-emerald-700 uppercase mb-1 block">Extraer del Abono</label>
                                    <div className="flex gap-2">
                                        <select value={courierBank} onChange={e=>setCourierBank(e.target.value)} className="w-24 text-[10px] bg-white border border-emerald-200 rounded-lg p-2 font-bold outline-none">
                                            <option value="pichincha">Pichincha</option><option value="guayaquil">Guayaquil</option><option value="pacifico">Pacífico</option><option value="efectivo">Efectivo</option>
                                        </select>
                                        <button onClick={()=>handlePayWithBalance(finalShippingCost, shippingPending)} disabled={shippingPending <= 0.01} className="flex-1 bg-emerald-600 text-white rounded-lg font-black text-xs py-3 px-4 shadow disabled:opacity-50 hover:bg-emerald-700 transition-colors">USAR SALDO ROPA (${safeClothingBalance.toFixed(2)})</button>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-3 pt-4 border-t border-slate-200">
                                <h3 className="font-bold text-slate-400 text-xs uppercase">Detalles de Empaque y Salida</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase">Nº Bultos</label>
                                        <input type="number" value={bultos} onChange={e=>setBultos(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500" min="1" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase">Detalle Bultos</label>
                                        <input type="text" value={packingDetail} onChange={e=>setPackingDetail(e.target.value)} placeholder="Ej: 15 y 10 prendas" className="w-full p-3 border border-slate-300 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500" />
                                    </div>
                                </div>

                                <input value={guide} onChange={e => setGuide(e.target.value)} className="w-full p-4 border-2 border-slate-300 rounded-xl text-2xl font-mono font-bold focus:border-indigo-600 outline-none mt-2 uppercase" placeholder="Nº GUÍA / NOTA..." />
                                <input type="date" value={dispatchDate} onChange={e => setDispatchDate(e.target.value)} className="w-full p-3 border rounded-xl font-bold text-slate-600 outline-none" />
                            </div>
                        </div>

                        <div className="p-4 bg-white border-t space-y-2">
                            <button onClick={finalizeShipment} className={`w-full py-4 rounded-xl font-black text-white text-lg shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95 ${isDebt ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}>{isDebt ? <Icon.Alert /> : <Icon.Check />} {isDebt ? 'DESPACHAR (CON DEUDA)' : 'CONFIRMAR SALIDA'}</button>
                            <button onClick={returnToPrep} className="w-full py-3 rounded-xl font-bold text-slate-400 border border-slate-200 hover:bg-slate-50 text-xs transition-colors">↩️ Regresar a Alistar</button>
                        </div>
                    </div>
                </div>
            );
        }

        return (
            <div className="flex flex-col h-full bg-[#f0f2f5]">
                <div className="flex bg-white shadow-sm z-10">
                    <button onClick={() => setTab('prep')} className={`flex-1 py-4 text-xs font-black uppercase tracking-widest border-b-4 transition-colors ${tab==='prep' ? 'border-indigo-600 text-indigo-700 bg-indigo-50' : 'border-transparent text-slate-400 hover:bg-slate-50'}`}>1. Perchas ({prepList.length})</button>
                    <button onClick={() => setTab('dispatch')} className={`flex-1 py-4 text-xs font-black uppercase tracking-widest border-b-4 transition-colors ${tab==='dispatch' ? 'border-purple-600 text-purple-700 bg-purple-50' : 'border-transparent text-slate-400 hover:bg-slate-50'}`}>2. Despacho ({dispatchList.length})</button>
                    <button onClick={() => setTab('balances')} className={`flex-1 py-4 text-xs font-black uppercase tracking-widest border-b-4 transition-colors ${tab==='balances' ? 'border-emerald-600 text-emerald-700 bg-emerald-50' : 'border-transparent text-slate-400 hover:bg-slate-50'}`}>3. Saldos ({balanceRows.length})</button>
                </div>
                
                <div className="flex-1 overflow-y-auto p-4 pb-24">
                    {tab === 'prep' && (
                        <div className="space-y-3">
                            {prepList.map(c => {
                                const safeItemsCount = c.cycle?.itemsCount || 0;
                                const safeName = c.name || 'Sin nombre';
                                return (
                                    <div key={c.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center hover:border-indigo-200 transition-colors">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="font-black text-xl text-slate-800">{c.id}</span>
                                                <input value={c.shelf || ''} onChange={e => logic.setClients(c.id, { shelf: (e.target.value || '').toUpperCase() })} onClick={e => e.stopPropagation()} placeholder="Percha" className="w-16 text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200 rounded p-1 text-center outline-none uppercase focus:border-amber-400" />
                                            </div>
                                            <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-2">{safeName} <span className="text-[9px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-bold">Hace {Math.floor((new Date() - c.lastMove) / (1000 * 60 * 60 * 24))} días</span></div>
                                            <div className="mt-1 inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[10px] font-bold border border-indigo-100"><Icon.Box /> {safeItemsCount} prendas</div>
                                        </div>
                                        <button onClick={() => moveToDispatch(c)} className="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-xs shadow-md hover:bg-indigo-700 active:scale-95 transition-all">LISTO ➤</button>
                                    </div>
                                );
                            })}
                            {prepList.length===0 && <div className="text-center text-slate-400 italic py-10 font-bold border-2 border-dashed border-slate-200 rounded-2xl">Nada pendiente.</div>}
                        </div>
                    )}

                    {tab === 'dispatch' && (
                        <div className="space-y-3">
                            {dispatchList.length > 0 && (
                                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar mb-2 border-b border-slate-200">
                                    <button onClick={() => setCityFilter('ALL')} className={`px-4 py-2 rounded-xl text-[10px] uppercase tracking-wider font-black whitespace-nowrap transition-all border shadow-sm ${cityFilter === 'ALL' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>TODAS ({dispatchList.length})</button>
                                    {Array.from(new Set(dispatchList.map(c => (c.city || 'SIN CIUDAD').trim().toUpperCase()))).sort().map(city => {
                                        const count = dispatchList.filter(c => ((c.city || 'SIN CIUDAD').trim().toUpperCase()) === city).length;
                                        return (
                                            <button key={city} onClick={() => setCityFilter(city)} className={`px-4 py-2 rounded-xl text-[10px] uppercase tracking-wider font-black whitespace-nowrap transition-all border shadow-sm ${cityFilter === city ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-purple-600 border-purple-200 hover:bg-purple-50'}`}>
                                                📍 {city} ({count})
                                            </button>
                                        );
                                    })}
                                </div>
                            )}

                            {dispatchList.filter(c => cityFilter === 'ALL' || ((c.city || 'SIN CIUDAD').trim().toUpperCase()) === cityFilter).map(c => {
                                const baseS = Number(c.shippingCost)||0; 
                                const descS = Number(c.shippingDiscount)||0;
                                const finalS = Math.max(0, baseS - descS);
                                const safeShippingPaid = Number(c.cycle?.totalShippingPaid) || 0;
                                const isPendingShip = finalS > safeShippingPaid;
                                
                                return (
                                    <div key={c.id} onClick={() => setSelectedClient(c)} className={`bg-white p-4 rounded-2xl shadow-sm border-l-4 cursor-pointer hover:scale-[1.01] transition-transform flex justify-between items-center ${isPendingShip ? 'border-l-orange-400' : 'border-l-emerald-500'}`}>
                                        <div className="flex-1 pr-4">
                                            <div className="font-black text-xl text-slate-800 leading-none">{c.id}</div>
                                            <div className="text-xs font-bold text-slate-500 uppercase mt-1">{c.name || 'Sin Nombre'}</div>
                                            
                                            <div className="mt-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                <div className="text-[11px] font-black text-indigo-700 uppercase flex items-center gap-1">📍 {c.city || 'Ciudad?'} <span className="text-slate-400 font-normal">({c.province || 'Provincia?'})</span></div>
                                                <div className="text-[10px] text-slate-600 mt-1 leading-tight">{c.address || 'Sin dirección registrada'}</div>
                                            </div>
                                            
                                            <div className="mt-2 text-[10px] font-bold text-slate-400 flex items-center gap-1 bg-white inline-block px-2 py-1 rounded border border-slate-100">{c.deliveryMethod || 'Ruta Pendiente'}</div>
                                        </div>
                                        <div className="text-right flex-shrink-0">
                                            <div className="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100 shadow-sm"><Icon.Edit /></div>
                                        </div>
                                    </div>
                                );
                            })}
                            {dispatchList.length===0 && <div className="text-center text-slate-400 py-10 font-bold italic border-2 border-dashed border-slate-200 rounded-2xl">No hay paquetes en esta ciudad.</div>}
                        </div>
                    )}

                    {tab === 'balances' && (
                        <div className="space-y-4 max-w-3xl mx-auto">
                            <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 text-white p-5 shadow-xl">
                                <div className="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10"></div>
                                <div className="relative">
                                    <div className="text-[10px] font-black uppercase tracking-[0.25em] text-emerald-100">Revisión del día</div>
                                    <h2 className="text-2xl font-black mt-1">Saldos por WhatsApp</h2>
                                    <p className="text-xs text-emerald-50 mt-1 max-w-xl">Revisa quién debe, de cuáles lives y cuántas prendas. Tú eliges las clientas antes de enviar.</p>
                                    <div className="grid grid-cols-3 gap-2 mt-5">
                                        <div className="bg-white/15 rounded-2xl p-3 backdrop-blur-sm"><div className="text-[9px] font-black uppercase text-emerald-100">Pendientes</div><div className="text-2xl font-black">{balanceRows.length}</div></div>
                                        <div className="bg-white/15 rounded-2xl p-3 backdrop-blur-sm"><div className="text-[9px] font-black uppercase text-emerald-100">Seleccionadas</div><div className="text-2xl font-black">{selectedBalanceRows.length}</div></div>
                                        <div className="bg-white/15 rounded-2xl p-3 backdrop-blur-sm"><div className="text-[9px] font-black uppercase text-emerald-100">Por cobrar</div><div className="text-xl font-black">${selectedBalanceTotal.toFixed(2)}</div></div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center justify-between gap-3 sticky top-0 z-10">
                                <button onClick={selectAllBalances} className="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 text-[10px] font-black uppercase tracking-wider active:scale-95 transition-transform">
                                    {balanceRows.filter(row => row.hasPhone).length > 0 && balanceRows.filter(row => row.hasPhone).every(row => selectedBalanceIds.includes(row.clientId)) ? 'Quitar todas' : 'Seleccionar todas'}
                                </button>
                                <button onClick={sendBalanceBatch} disabled={isSendingBalances || selectedBalanceRows.length === 0} className="flex-1 max-w-sm bg-emerald-600 disabled:bg-slate-300 text-white py-3 rounded-xl font-black text-xs shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 active:scale-95 transition-all">
                                    <Icon.Message /> {isSendingBalances ? 'ENVIANDO…' : `ENVIAR ${selectedBalanceRows.length} SALDOS`}
                                </button>
                            </div>

                            <div className="space-y-3">
                                {balanceRows.map(row => {
                                    const status = balanceStatuses[row.clientId];
                                    const selected = selectedBalanceIds.includes(row.clientId) && row.hasPhone;
                                    return (
                                        <div key={row.clientId} className={`bg-white rounded-2xl border-2 p-4 shadow-sm transition-all ${selected ? 'border-emerald-300 ring-4 ring-emerald-50' : 'border-slate-100'} ${status === 'sent' ? 'bg-emerald-50' : status === 'error' ? 'bg-red-50 border-red-200' : ''}`}>
                                            <div className="flex gap-3">
                                                <label className={`mt-1 ${row.hasPhone ? 'cursor-pointer' : 'cursor-not-allowed opacity-40'}`}>
                                                    <input type="checkbox" className="w-5 h-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" checked={selected} disabled={!row.hasPhone || isSendingBalances} onChange={() => toggleBalanceRow(row.clientId)} />
                                                </label>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex justify-between gap-2 items-start">
                                                        <div>
                                                            <div className="font-black text-slate-800 text-lg leading-none">{row.clientId}</div>
                                                            <div className="text-xs font-bold text-slate-500 uppercase mt-1">{row.name}</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-xl font-black text-red-600">${row.amount.toFixed(2)}</div>
                                                            <div className="text-[9px] font-black uppercase text-slate-400">{row.itemsCount} prendas</div>
                                                        </div>
                                                    </div>
                                                    <div className="mt-3 space-y-1">
                                                        {(row.groups || []).map(group => (
                                                            <div key={group.key} className="flex justify-between gap-2 text-[10px] bg-slate-50 border border-slate-100 rounded-lg px-2.5 py-2">
                                                                <span className="font-bold text-slate-600">🛍️ {group.label}{group.itemsCount > 0 ? ` · ${group.itemsCount} prenda${group.itemsCount === 1 ? '' : 's'}` : ''}</span>
                                                                <span className="font-black text-slate-700">${Number(group.amount || 0).toFixed(2)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="flex justify-between items-center mt-3 gap-2">
                                                        <div className={`text-[9px] font-bold ${row.hasPhone ? 'text-emerald-600' : 'text-red-500'}`}>{row.hasPhone ? `📞 +${row.phone}` : '⚠️ Falta un WhatsApp válido'}</div>
                                                        <div className="flex items-center gap-2">
                                                            {status === 'sending' && <span className="text-[9px] font-black text-amber-600 animate-pulse">ENVIANDO…</span>}
                                                            {status === 'sent' && <span className="text-[9px] font-black text-emerald-700">ENVIADO ✅</span>}
                                                            {status === 'error' && <span className="text-[9px] font-black text-red-600">NO ENVIADO</span>}
                                                            {row.hasPhone && <button onClick={() => openManualBalance(row)} disabled={isSendingBalances} className="px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 text-[9px] font-black uppercase active:scale-95">Abrir uno</button>}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                                {balanceRows.length === 0 && <div className="text-center bg-white border-2 border-dashed border-emerald-200 rounded-3xl py-12 text-emerald-700"><div className="text-4xl mb-2">🎉</div><div className="font-black">¡No hay saldos pendientes!</div><div className="text-xs text-slate-400 mt-1">Todas las clientas están al día.</div></div>}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };



    // ============================================================
    // IMPORTADOR DE VENTAS DESDE FOTO — NUEVA GEN. 🧬
    // Gemini interpreta el registro manuscrito; nada se guarda hasta
    // que la administradora revise y confirme todas las filas.
    // ============================================================
    const PhotoSalesImportModal = ({ logic, onClose, defaultDate }) => {
        const [file, setFile] = useState(null);
        const [previewUrl, setPreviewUrl] = useState('');
        const [saleDate, setSaleDate] = useState(defaultDate || getToday());
        const [rows, setRows] = useState([]);
        const [warnings, setWarnings] = useState([]);
        const [batchId, setBatchId] = useState('');
        const [imageHash, setImageHash] = useState('');
        const [stage, setStage] = useState('select');
        const [error, setError] = useState('');
        const [isBusy, setIsBusy] = useState(false);

        useEffect(() => () => {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
        }, [previewUrl]);

        const selectFile = async (selectedFile) => {
            if (!selectedFile) return;
            if (!selectedFile.type.startsWith('image/')) {
                setError('Selecciona una fotografía válida.');
                return;
            }
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            setFile(selectedFile);
            setPreviewUrl(URL.createObjectURL(selectedFile));
            setRows([]);
            setWarnings([]);
            setError('');
            setStage('select');
            setImageHash(await hashFile(selectedFile));
        };

        const analyzePhoto = async () => {
            if (!file) return setError('Primero toma o selecciona una fotografía.');
            setIsBusy(true);
            setError('');
            try {
                const form = new FormData();
                form.append('image', file, file.name || 'registro-ventas.jpg');
                form.append('saleDate', saleDate);
                form.append('imageHash', imageHash || await hashFile(file));
                form.append('knownClients', JSON.stringify(logic.clients.map(c => ({ id: c.id, name: c.name }))));

                const result = await adelitaApiRequest('/api/v2/imports/sales/analyze', {
                    method: 'POST', body: form, timeoutMs: 60000
                });

                const detectedRows = Array.isArray(result?.rows) ? result.rows : [];
                if (!detectedRows.length) throw new Error('Gemini no encontró ventas claras en la imagen.');

                setBatchId(result.batchId || createOperationId('photo_import'));
                setWarnings(Array.isArray(result.warnings) ? result.warnings : []);
                setRows(detectedRows.map((row, index) => {
                    const detectedCode = String(row.clientId || row.clientCode || '').trim().toUpperCase();
                    const matchedClient = logic.clients.find(client => client.id.toUpperCase() === detectedCode);
                    return {
                        sourceRow: row.sourceRow ?? index + 1,
                        clientId: matchedClient?.id || detectedCode,
                        clientName: matchedClient?.name || row.clientName || '',
                        item: row.item || row.description || 'Prenda',
                        quantity: Math.max(1, parseInt(row.quantity ?? row.qty, 10) || 1),
                        unitPrice: Number(row.unitPrice ?? row.price ?? row.value) || 0,
                        owner: row.owner || 'me',
                        confidence: Number(row.confidence) || 0,
                        notes: row.notes || '',
                        enabled: row.enabled !== false,
                        clientExists: Boolean(matchedClient)
                    };
                }));
                setStage('review');
            } catch (analysisError) {
                setError(analysisError.message || 'No se pudo analizar la fotografía. El Worker 2.0 debe estar publicado.');
            } finally {
                setIsBusy(false);
            }
        };

        const updateRow = (index, key, value) => {
            setRows(current => current.map((row, rowIndex) => {
                if (rowIndex !== index) return row;
                const next = { ...row, [key]: value };
                if (key === 'clientId') {
                    const matched = logic.clients.find(client => client.id.toUpperCase() === String(value).trim().toUpperCase());
                    next.clientExists = Boolean(matched);
                    next.clientName = matched?.name || next.clientName || '';
                }
                return next;
            }));
        };

        const removeRow = (index) => setRows(current => current.filter((_, rowIndex) => rowIndex !== index));
        const addEmptyRow = () => setRows(current => [...current, {
            sourceRow: current.length + 1, clientId: '', clientName: '', item: 'Prenda',
            quantity: 1, unitPrice: 0, owner: 'me', confidence: 1,
            notes: 'Fila agregada manualmente', enabled: true, clientExists: false
        }]);

        const validation = useMemo(() => {
            const enabledRows = rows.filter(row => row.enabled !== false);
            const invalid = enabledRows.filter(row => {
                const clientExists = logic.clients.some(client => client.id.toUpperCase() === String(row.clientId).trim().toUpperCase());
                return !clientExists || !String(row.item || '').trim() || !Number.isFinite(Number(row.unitPrice)) || Number(row.unitPrice) < 0 || (parseInt(row.quantity, 10) || 0) < 1;
            });
            return {
                enabledRows,
                invalid,
                itemCount: enabledRows.reduce((sum, row) => sum + (parseInt(row.quantity, 10) || 0), 0),
                total: enabledRows.reduce((sum, row) => sum + ((Number(row.unitPrice) || 0) * (parseInt(row.quantity, 10) || 0)), 0)
            };
        }, [rows, logic.clients]);

        const commitImport = async () => {
            if (validation.invalid.length) {
                return setError(`Corrige ${validation.invalid.length} fila(s) marcada(s) antes de registrar.`);
            }
            if (!validation.enabledRows.length) return setError('No hay ventas seleccionadas.');
            if (!window.confirm(`¿Registrar ${validation.itemCount} prendas por $${validation.total.toFixed(2)}?\n\nLa fotografía no podrá duplicarse con el mismo lote.`)) return;

            setIsBusy(true);
            setError('');
            try {
                await logic.importPhotoSales({
                    rows: validation.enabledRows,
                    saleDate,
                    batchId: batchId || createOperationId('photo_import'),
                    imageHash
                });
                setStage('done');
            } catch (commitError) {
                setError(commitError.message || 'No se pudieron registrar las ventas.');
            } finally {
                setIsBusy(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[7000] bg-slate-950/90 backdrop-blur-md p-3 md:p-6 flex items-center justify-center" onClick={onClose}>
                <div className="bg-white rounded-[2rem] w-full max-w-6xl max-h-[96vh] overflow-hidden shadow-2xl flex flex-col" onClick={event => event.stopPropagation()}>
                    <div className="p-4 md:p-5 bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-500 text-white flex justify-between items-center shrink-0">
                        <div>
                            <div className="text-[9px] font-black uppercase tracking-[.25em] opacity-80">Adelita Store 2.0 Nueva Gen. 🧬</div>
                            <h3 className="text-xl md:text-2xl font-black">Ventas desde una fotografía</h3>
                            <p className="text-[10px] md:text-xs font-bold opacity-90 mt-1">Gemini interpreta · tú corriges · Adelita Core registra sin duplicados</p>
                        </div>
                        <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/20 font-black text-xl active:scale-95">✕</button>
                    </div>

                    <div className="flex-1 overflow-y-auto newgen-scrollbar bg-slate-50 p-4 md:p-6">
                        {stage === 'done' ? (
                            <div className="min-h-[420px] flex flex-col items-center justify-center text-center">
                                <div className="w-24 h-24 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-5xl shadow-inner">✓</div>
                                <h4 className="text-3xl font-black text-slate-800 mt-6">Ventas registradas</h4>
                                <p className="text-slate-500 font-bold mt-2">{validation.itemCount} prendas · ${validation.total.toFixed(2)}</p>
                                <button onClick={onClose} className="mt-8 px-8 py-4 bg-slate-900 text-white rounded-2xl font-black shadow-xl active:scale-95">VOLVER AL LIVE</button>
                            </div>
                        ) : (
                            <div className="space-y-5">
                                <div className="grid md:grid-cols-[360px_1fr] gap-5">
                                    <div className="bg-white rounded-3xl border border-slate-200 p-4 shadow-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Registro fotografiado</div>
                                            <input type="date" value={saleDate} onChange={event => setSaleDate(event.target.value)} className="text-xs font-black border border-slate-200 rounded-xl p-2" />
                                        </div>
                                        <label className="block aspect-[4/5] rounded-2xl border-2 border-dashed border-violet-200 bg-violet-50 overflow-hidden cursor-pointer relative group">
                                            {previewUrl ? (
                                                <img src={previewUrl} className="w-full h-full object-contain bg-slate-900" alt="Registro de ventas" />
                                            ) : (
                                                <div className="h-full flex flex-col items-center justify-center text-violet-500 p-6 text-center">
                                                    <div className="text-6xl mb-4">📷</div>
                                                    <div className="font-black">TOMAR FOTO O ELEGIR IMAGEN</div>
                                                    <div className="text-xs font-bold text-slate-400 mt-2">Procura buena luz, hoja completa y letra enfocada.</div>
                                                </div>
                                            )}
                                            <input type="file" accept="image/*" capture="environment" className="absolute inset-0 opacity-0 cursor-pointer" onChange={event => selectFile(event.target.files?.[0])} />
                                        </label>
                                        <button onClick={analyzePhoto} disabled={!file || isBusy} className="w-full mt-4 py-4 rounded-2xl bg-violet-600 disabled:bg-slate-300 text-white font-black shadow-lg active:scale-95 flex items-center justify-center gap-2">
                                            {isBusy && stage !== 'review' ? 'ANALIZANDO…' : '✨ INTERPRETAR CON GEMINI'}
                                        </button>
                                        <div className="text-[9px] text-slate-400 font-bold mt-3 leading-relaxed">La IA crea solamente un borrador. Ninguna venta entra a Firebase antes de tu confirmación.</div>
                                    </div>

                                    <div className="min-w-0">
                                        {stage === 'select' ? (
                                            <div className="h-full min-h-[420px] bg-white border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-center p-8">
                                                <div className="text-6xl">🧬</div>
                                                <h4 className="text-2xl font-black text-slate-700 mt-4">Lectura inteligente de ventas</h4>
                                                <p className="max-w-lg text-sm font-bold text-slate-400 mt-3">Detectará código de clienta, descripción de la prenda, cantidad, precio unitario y observaciones. Después podrás cambiar cualquier dato.</p>
                                            </div>
                                        ) : (
                                            <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                                                <div className="p-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                    <div>
                                                        <div className="font-black text-slate-800">Borrador detectado</div>
                                                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Revisa antes de confirmar</div>
                                                    </div>
                                                    <button onClick={addEmptyRow} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-[10px] font-black active:scale-95">+ AGREGAR FILA</button>
                                                </div>
                                                <div className="overflow-x-auto newgen-scrollbar">
                                                    <table className="photo-import-table w-full text-left">
                                                        <thead className="bg-slate-900 text-white text-[9px] uppercase tracking-widest">
                                                            <tr>
                                                                <th className="p-3">✓</th><th className="p-3">Código</th><th className="p-3">Clienta</th><th className="p-3">Descripción</th><th className="p-3">Cant.</th><th className="p-3">Precio</th><th className="p-3">Dueña</th><th className="p-3">Conf.</th><th className="p-3"></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100">
                                                            {rows.map((row, index) => {
                                                                const existingClient = logic.clients.find(client => client.id.toUpperCase() === String(row.clientId).trim().toUpperCase());
                                                                const invalid = row.enabled !== false && (!existingClient || !String(row.item || '').trim() || Number(row.unitPrice) < 0 || !Number.isFinite(Number(row.unitPrice)) || (parseInt(row.quantity, 10) || 0) < 1);
                                                                return (
                                                                    <tr key={`${row.sourceRow}-${index}`} className={`${invalid ? 'bg-red-50' : row.enabled === false ? 'opacity-40 bg-slate-50' : 'bg-white'}`}>
                                                                        <td className="p-2 text-center"><input type="checkbox" checked={row.enabled !== false} onChange={event => updateRow(index, 'enabled', event.target.checked)} /></td>
                                                                        <td className="p-2"><input value={row.clientId} onChange={event => updateRow(index, 'clientId', event.target.value.toUpperCase())} className={!existingClient ? '!border-red-300 !bg-red-50' : ''} /></td>
                                                                        <td className="p-2"><div className="text-[10px] font-black text-slate-600 min-w-[130px]">{existingClient?.name || row.clientName || 'NO ENCONTRADA'}</div></td>
                                                                        <td className="p-2"><input value={row.item} onChange={event => updateRow(index, 'item', event.target.value)} /></td>
                                                                        <td className="p-2"><input type="number" min="1" step="1" value={row.quantity} onChange={event => updateRow(index, 'quantity', event.target.value)} /></td>
                                                                        <td className="p-2"><input type="number" min="0" step="0.01" value={row.unitPrice} onChange={event => updateRow(index, 'unitPrice', event.target.value)} /></td>
                                                                        <td className="p-2"><select value={row.owner} onChange={event => updateRow(index, 'owner', event.target.value)}><option value="me">MI ROPA</option>{logic.partners.map(partner => <option key={partner} value={partner}>{partner}</option>)}</select></td>
                                                                        <td className="p-2"><div className={`text-[9px] font-black px-2 py-1 rounded-full text-center ${row.confidence >= .85 ? 'bg-emerald-100 text-emerald-700' : row.confidence >= .6 ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}`}>{Math.round((row.confidence || 0) * 100)}%</div></td>
                                                                        <td className="p-2"><button onClick={() => removeRow(index)} className="w-8 h-8 rounded-lg bg-red-50 text-red-500 font-black">✕</button></td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {warnings.length > 0 && (
                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                                        <div className="font-black text-amber-800 text-xs uppercase tracking-widest mb-2">Advertencias de lectura</div>
                                        {warnings.map((warning, index) => <div key={index} className="text-xs font-bold text-amber-700">• {warning}</div>)}
                                    </div>
                                )}
                                {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 text-sm font-black">⚠️ {error}</div>}
                            </div>
                        )}
                    </div>

                    {stage === 'review' && (
                        <div className="p-4 md:p-5 border-t border-slate-200 bg-white flex flex-col md:flex-row justify-between items-center gap-3 shrink-0">
                            <div className="grid grid-cols-3 gap-2 w-full md:w-auto">
                                <div className="bg-slate-50 rounded-xl px-4 py-2 text-center"><div className="text-[8px] font-black text-slate-400 uppercase">Filas</div><div className="font-black text-slate-800">{validation.enabledRows.length}</div></div>
                                <div className="bg-slate-50 rounded-xl px-4 py-2 text-center"><div className="text-[8px] font-black text-slate-400 uppercase">Prendas</div><div className="font-black text-slate-800">{validation.itemCount}</div></div>
                                <div className="bg-emerald-50 rounded-xl px-4 py-2 text-center"><div className="text-[8px] font-black text-emerald-500 uppercase">Total</div><div className="font-black text-emerald-700">${validation.total.toFixed(2)}</div></div>
                            </div>
                            <button onClick={commitImport} disabled={isBusy || validation.invalid.length > 0 || validation.enabledRows.length === 0} className="w-full md:w-auto px-8 py-4 bg-emerald-600 disabled:bg-slate-300 text-white rounded-2xl font-black shadow-xl active:scale-95">
                                {isBusy ? 'REGISTRANDO…' : validation.invalid.length ? `CORRIGE ${validation.invalid.length} FILA(S)` : 'CONFIRMAR Y REGISTRAR VENTAS'}
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // --- LIVE VIEW 2.0: MULTI-CARGA (CARRITO RAPIDO) ---
    // --- LIVE VIEW MULTI-SOCIA ---
    // --- LIVE VIEW 7.1 (CORREGIDO: MULTI-SOCIA SIN ERRORES) ---
        // --- LIVE VIEW 13.0: TECLADO NORMAL CORREGIDO, 75/25 Y BOTONES ABAJO ---
    // --- LIVE VIEW 14.0: FOCO EN CANTIDAD Y TECLADO REINICIADO (LÓGICA LIMPIA) ---
    const LiveView = ({ logic }) => {
        const [search, setSearch] = useState(""); 
        const [found, setFound] = useState(null); 
        
        const [item, setItem] = useState("Prenda"); 
        const [qty, setQty] = useState("1"); 
        const [price, setPrice] = useState(""); 
        
        // Control de teclado normalizado (Calculadora)
        const [activeInput, setActiveInput] = useState('qty'); 
        const isFresh = useRef(true); 
        
        const [currentOwner, setCurrentOwner] = useState('me'); 
        const [showNewPartner, setShowNewPartner] = useState(false);
        const [newPartnerName, setNewPartnerName] = useState("");
        
        const [cart, setCart] = useState([]); 
        const [msg, setMsg] = useState(null); 
        const [suggestions, setSuggestions] = useState([]); 
        const [saleDate, setSaleDate] = useState(getToday());
        const [showPhotoImport, setShowPhotoImport] = useState(false);

        const PRICE_OPTIONS = ["0.50", "0.75", "1.00", "1.25", "1.50", "1.75"];

        useEffect(() => {
            if (search.length > 0) { 
                const matches = logic.clients.filter(c => c.id.toLowerCase().startsWith(search.toLowerCase()) || c.name.toLowerCase().includes(search.toLowerCase())).slice(0, 3); 
                setSuggestions(matches); 
            } else { 
                setSuggestions([]); 
            }
            const exactMatch = logic.clients.find(c => c.id.toLowerCase() === search.toLowerCase()); 
            setFound(exactMatch || null);
        }, [search, logic.clients]);

        // Foco prioritario al seleccionar cliente
        const selectSuggestion = (client) => { 
            setSearch(client.id); 
            setFound(client); 
            setSuggestions([]); 
            setCart([]); 
            
            setActiveInput('qty');
            isFresh.current = true;
        };

        const handleAddPartner = () => {
            if(newPartnerName) { 
                logic.savePartner(newPartnerName); 
                setCurrentOwner(newPartnerName.toUpperCase()); 
                setShowNewPartner(false); 
                setNewPartnerName(""); 
            }
        };

        // Lógica purificada de Calculadora Normal
        const handlePad = (val) => {
            if (val === 'C') {
                if (activeInput === 'qty') setQty(""); 
                else if (activeInput === 'price') setPrice("");
                isFresh.current = true;
                return;
            }

            if (activeInput === 'qty') {
                if (val === '.') return; // Cantidades no llevan decimales
                if (isFresh.current) {
                    setQty(val);
                    isFresh.current = false;
                } else {
                    setQty(prev => prev + val);
                }
            } else if (activeInput === 'price') {
                if (isFresh.current) {
                    setPrice(val === '.' ? '0.' : val);
                    isFresh.current = false;
                } else {
                    if (val === '.' && price.includes('.')) return; // Evitar múltiples puntos
                    setPrice(prev => prev + val);
                }
            }
        };

        const handleInputFocus = (fieldName) => {
            setActiveInput(fieldName);
            isFresh.current = true; 
        };

        const handleObsequio = () => {
            setItem("Obsequio");
            setQty("1");
            setPrice("0");
            setActiveInput('qty');
            isFresh.current = true;
        };

        const addToCart = () => {
            if (!item || price === "") return; 
            const newItem = { item, price: parseFloat(price), qty: parseInt(qty) || 1, id: Date.now(), owner: currentOwner };
            setCart([...cart, newItem]);
            
            // Foco prioritario en cantidad para la siguiente prenda
            setItem("Prenda"); 
            setPrice(""); 
            setQty("1");
            setActiveInput('qty'); 
            isFresh.current = true;
        };

        const removeFromCart = (tempId) => { setCart(cart.filter(x => x.id !== tempId)); };

        const handleFinalize = async (e) => {
            e.preventDefault(); 
            if (!found) return;
            const itemsToSave = [...cart];
            
            if (item && price !== "") { 
                itemsToSave.push({ item, price: parseFloat(price), qty: parseInt(qty) || 1, owner: currentOwner }); 
            }
            
            if (itemsToSave.length === 0) return alert("Nada que guardar.");
            const finalDate = smartDate(saleDate, logic.getClientCycle(found.id).lastShipmentDate); 
            try {
                await Promise.all(itemsToSave.map(line => logic.addBatchSales(found.id, line.item, line.price, finalDate, line.qty, line.owner)));
            } catch (error) {
                alert(`⚠️ ${error.message || 'No se pudieron guardar las prendas.'}`);
                return;
            }
            
            setMsg(`✅ ¡${itemsToSave.reduce((s, i) => s + i.qty, 0)} prendas guardadas a ${found.id}!`);
            setTimeout(() => setMsg(null), 3500);
            
            setItem("Prenda"); setPrice(""); setSearch(""); setFound(null); setSuggestions([]); setQty("1"); setCart([]);
            setActiveInput('qty'); isFresh.current = true;
        };

        const totalCartItems = cart.reduce((acc, i) => acc + i.qty, 0);
        const totalCartValue = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

        return (
            <div className="h-full flex flex-col md:flex-row bg-[#f0f2f5] overflow-hidden relative">

                {msg && (

                                <label className={`text-[10px] font-black uppercase tracking-widest block mb-1.5 ${activeInput==='price'?'text-emerald-600':'text-slate-400'}`}><Icon.Dollar/> Precio Unit.</label>

    // --- BODEGA INTELIGENTE (VERSIÓN BLINDADA / ANTI-CRASH) ---
       // --- BODEGA INTELIGENTE (VERSIÓN QUIRÚRGICA / ANTI-CRASH) ---
 
    // --- NUEVO REPORTE INTELIGENTE (MINIMALISTA Y ORDEN CRONOLÓGICO PERFECTO) ---
    const ReportViewer = ({ logic, onClose, metrics }) => {
        const [activeTab, setActiveTab] = useState('sales'); 
        const [showHelp, setShowHelp] = useState(false);

        const reportData = useMemo(() => {
            try {
                const debtors = [];
                const now = new Date();
                now.setHours(0,0,0,0);

                const formatRange = (startOffset, endOffset) => {
                    const start = new Date(now); start.setDate(start.getDate() - startOffset);
                    const end = new Date(now); end.setDate(end.getDate() - endOffset);
                    const opt = { day: 'numeric', month: 'short' };
                    return `${start.toLocaleDateString('es-ES', opt)} al ${end.toLocaleDateString('es-ES', opt)}`;
                };

                const tempPeriods = {};

                logic.sales.forEach(sale => {
                    const date = new Date(safeISO(sale.date)); 
                    if (isNaN(date)) return;
                    
                    date.setHours(0,0,0,0);
                    const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

                    let periodKey = "";
                    let isRecent = false;
                    let periodOrder = 0;

                    // CORRECCIÓN DEL TIEMPO: Usamos los milisegundos reales (now.getTime()) 
                    // para que las semanas siempre pesen más que los meses viejos.
                    if (diffDays <= 6) {
                        periodKey = `Últimos 7 días (${formatRange(6, 0)})`;
                        isRecent = true;
                        periodOrder = now.getTime(); 
                    } else if (diffDays <= 13) {
                        periodKey = `Hace 1 semana (${formatRange(13, 7)})`;
                        periodOrder = now.getTime() - (7 * 86400000);
                    } else if (diffDays <= 20) {
                        periodKey = `Hace 2 semanas (${formatRange(20, 14)})`;
                        periodOrder = now.getTime() - (14 * 86400000);
                    } else if (diffDays <= 27) {
                        periodKey = `Hace 3 semanas (${formatRange(27, 21)})`;
                        periodOrder = now.getTime() - (21 * 86400000);
                    } else {
                        periodKey = capitalizeFirst(date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
                        // Al mes le ponemos el día 1, que siempre será menor a los "now.getTime()" recientes
                        periodOrder = new Date(date.getFullYear(), date.getMonth(), 1).getTime();
                    }

                    if (!tempPeriods[periodKey]) {
                        tempPeriods[periodKey] = { label: periodKey, total: 0, isRecent, order: periodOrder, days: {} };
                    }

                    const dayKey = date.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                    if (!tempPeriods[periodKey].days[dayKey]) {
                        tempPeriods[periodKey].days[dayKey] = { label: capitalizeFirst(dayKey), total: 0, order: date.getTime(), clients: {} };
                    }

                    const clientKey = sale.clientId;
                    if (!tempPeriods[periodKey].days[dayKey].clients[clientKey]) {
                        const clientName = logic.clients.find(c => c.id === clientKey)?.name || "Desconocido";
                        tempPeriods[periodKey].days[dayKey].clients[clientKey] = { id: clientKey, name: clientName, total: 0, items: [] };
                    }

                    const val = Number(sale.value) || 0;
                    tempPeriods[periodKey].total += val;
                    tempPeriods[periodKey].days[dayKey].total += val;
                    tempPeriods[periodKey].days[dayKey].clients[clientKey].total += val;
                    tempPeriods[periodKey].days[dayKey].clients[clientKey].items.push(sale);
                });

                const resultGroups = Object.values(tempPeriods).sort((a,b) => b.order - a.order);
                resultGroups.forEach(period => {
                    period.daysArray = Object.values(period.days).sort((a,b) => b.order - a.order);
                    period.daysArray.forEach(day => {
                        day.clientsArray = Object.values(day.clients).sort((a,b) => b.total - a.total);
                    });
                });

                logic.clients.forEach(client => { 
                    try {
                        const cycle = logic.getClientCycle(client.id); 
                        if (cycle.clothingBalance < -0.01) { 
                            debtors.push({ ...client, balance: cycle.clothingBalance }); 
                        } 
                    } catch(e) {}
                });

                return { groups: resultGroups, debtors: debtors.sort((a,b) => a.balance - b.balance) };
            } catch (e) {
                return { groups: [], debtors: [] };
            }
        }, [logic.sales, logic.clients]);

        const handlePrint = () => { window.print(); };

        return (
            <div className="fixed inset-0 bg-[#f8fafc] z-[60] overflow-auto flex flex-col animate-in slide-in-from-bottom duration-300" id="printable-area">
                
                {/* CABECERA MINIMALISTA */}
                <div className="sticky top-0 bg-white border-b border-slate-200 p-4 flex justify-between items-center no-print z-10">
                    <h2 className="font-black text-slate-800 flex items-center gap-2 text-sm uppercase tracking-widest"><Icon.FileText /> Reportes</h2>
                    <div className="flex gap-3">
                        <button onClick={handlePrint} className="text-slate-500 hover:text-indigo-600 font-bold flex items-center gap-2 text-xs transition-colors"><Icon.Printer /> Imprimir</button>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-800 transition-colors"><Icon.Close /></button>
                    </div>
                </div>

                <div className="pt-8 px-4 md:px-8 max-w-4xl mx-auto w-full text-slate-800">
                    
                    {/* MÉTRICAS FINANCIERAS LIMPIAS */}
                    {metrics && (
                        <div className="grid grid-cols-3 gap-3 md:gap-6 mb-10">
                            <div className="p-5 bg-white rounded-2xl text-center border border-slate-200 shadow-sm"><div className="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Ingresos</div><div className="text-xl md:text-2xl font-black text-slate-800">{formatMoney(metrics.totalCollected)}</div></div>
