    const AdelitaCoreControlPanel = ({ logic, onJumpToClient }) => {
        const [requests, setRequests] = useState([]);
        const [loading, setLoading] = useState(false);
        const [processingId, setProcessingId] = useState('');
        const [message, setMessage] = useState('');
        const [expanded, setExpanded] = useState(false);

        const loadRequests = async () => {
            setLoading(true);
            setMessage('');
            try {
                const result = await adelitaApiRequest('/api/v2/operations?status=pending&limit=50', { method: 'GET', timeoutMs: 15000 });
                setRequests(Array.isArray(result?.requests) ? result.requests : []);
            } catch (error) {
                setRequests([]);
                setMessage('El Centro 2.0 quedará operativo al publicar el Worker 2.0. La app continúa usando el respaldo seguro de Firestore.');
            } finally {
                setLoading(false);
            }
        };

        useEffect(() => {
            if (expanded) loadRequests();
        }, [expanded]);

        const decide = async (requestId, action) => {
            if (!requestId || processingId) return;
            const label = action === 'approve' ? 'aprobar' : 'rechazar';
            if (!window.confirm(`¿Seguro que deseas ${label} esta solicitud?`)) return;
            setProcessingId(requestId);
            setMessage('');
            try {
                const result = await adelitaApiRequest(`/api/v2/operations/${encodeURIComponent(requestId)}/${action}`, {
                    method: 'POST',
                    body: JSON.stringify({ operationId: createOperationId(`app_${action}`), source: 'app' })
                });
                setMessage(action === 'approve' ? 'Solicitud aprobada correctamente. ✅' : 'Solicitud rechazada.');
                await loadRequests();
                if (result?.clientId && onJumpToClient) onJumpToClient(result.clientId);
            } catch (error) {
                setMessage(error.message || 'No se pudo procesar la solicitud.');
            } finally {
                setProcessingId('');
            }
        };

        const status = logic.coreStatus || {};
        const online = status.online;
        return (
            <div className="mb-6 bg-slate-950 text-white rounded-[2rem] overflow-hidden shadow-2xl border border-slate-800 no-print">
                <button onClick={() => setExpanded(current => !current)} className="w-full p-5 flex items-center justify-between gap-4 text-left">
                    <div className="flex items-center gap-4">
                        <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-500 to-pink-500 flex items-center justify-center text-2xl shadow-lg">🧬</div>
                        <div>
                            <div className="text-[9px] font-black uppercase tracking-[.25em] text-violet-300">Adelita Store 2.0 Nueva Gen.</div>
                            <div className="font-black text-lg">Centro de operaciones</div>
                            <div className="text-[10px] font-bold text-slate-400 mt-1">Pagos · códigos · comprobantes · ventas IA · envíos</div>
                        </div>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className={`px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest ${online ? 'bg-emerald-500/20 text-emerald-300' : status.legacyOnline ? 'bg-amber-500/20 text-amber-300' : 'bg-red-500/20 text-red-300'}`}>
                            {online ? 'Core conectado' : status.legacyOnline ? 'Modo híbrido' : 'Sin conexión'}
                        </span>
                        <span className={`transition-transform ${expanded ? 'rotate-180' : ''}`}>⌄</span>
                    </div>
                </button>

                {expanded && (
                    <div className="border-t border-slate-800 p-5 bg-slate-900/70">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <div className="font-black">Solicitudes pendientes</div>
                                <div className="text-[10px] text-slate-400 font-bold">Lo mismo que recibes por WhatsApp también puede aprobarse aquí.</div>
                            </div>
                            <button onClick={loadRequests} disabled={loading} className="px-4 py-2 bg-white/10 rounded-xl text-[10px] font-black active:scale-95">{loading ? 'ACTUALIZANDO…' : '↻ ACTUALIZAR'}</button>
                        </div>
                        {message && <div className="mb-4 p-3 rounded-xl bg-white/10 text-xs font-bold">{message}</div>}
                        <div className="space-y-3 max-h-[430px] overflow-y-auto newgen-scrollbar pr-1">
                            {requests.map(request => {
                                const typeLabel = request.type === 'new_client_code' ? 'NUEVA CLIENTA + PAGO' : request.type === 'payment' ? 'COMPROBANTE DE PAGO' : request.type === 'photo_sales_import' ? 'VENTAS DESDE FOTO' : String(request.type || 'OPERACIÓN').toUpperCase();
                                return (
                                    <div key={request.id} className="bg-white text-slate-800 rounded-2xl p-4 grid md:grid-cols-[1fr_auto] gap-4">
                                        <div>
                                            <div className="text-[9px] font-black text-violet-600 uppercase tracking-widest">{typeLabel}</div>
                                            <div className="font-black text-lg mt-1">{request.clientName || request.fullName || request.clientId || 'Solicitud administrativa'}</div>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3 text-[10px]">
                                                {request.clientId && <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400 font-black block">CÓDIGO</span><b>{request.clientId}</b></div>}
                                                {request.phone && <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400 font-black block">WHATSAPP</span><b>{request.phone}</b></div>}
                                                {Number.isFinite(Number(request.amount)) && <div className="bg-emerald-50 rounded-lg p-2"><span className="text-emerald-500 font-black block">MONTO</span><b>${Number(request.amount).toFixed(2)}</b></div>}
                                                {request.reference && <div className="bg-slate-50 rounded-lg p-2"><span className="text-slate-400 font-black block">REFERENCIA</span><b>{request.reference}</b></div>}
                                            </div>
                                            {request.preview && <div className="mt-3 text-xs font-bold text-slate-500 whitespace-pre-wrap">{request.preview}</div>}
                                        </div>
                                        <div className="flex md:flex-col gap-2 justify-end">
                                            <button onClick={() => decide(request.id, 'approve')} disabled={processingId === request.id} className="flex-1 md:flex-none px-5 py-3 bg-emerald-600 text-white rounded-xl text-[10px] font-black active:scale-95 disabled:opacity-50">APROBAR</button>
                                            <button onClick={() => decide(request.id, 'reject')} disabled={processingId === request.id} className="flex-1 md:flex-none px-5 py-3 bg-red-100 text-red-700 rounded-xl text-[10px] font-black active:scale-95 disabled:opacity-50">RECHAZAR</button>
                                        </div>
                                    </div>
                                );
                            })}
                            {!loading && requests.length === 0 && <div className="text-center py-10 text-slate-400 font-bold text-sm border border-dashed border-slate-700 rounded-2xl">No hay solicitudes pendientes o el Worker 2.0 aún no está publicado.</div>}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const AdminView = ({ logic, onClose, onJumpToClient }) => {
        const [showReport, setShowReport] = useState(false); 
        
        // ESTADOS NUEVO GASTO
        const [expDetail, setExpDetail] = useState("");
        const [expAmount, setExpAmount] = useState("");
        const [expDate, setExpDate] = useState(getToday());
        const [expType, setExpType] = useState('business'); 
        const [expAccount, setExpAccount] = useState('pichincha'); 

        // ESTADOS EDICIÓN Y TRANSFERENCIA
        const [editingExp, setEditingExp] = useState(null);
        const [showTransfer, setShowTransfer] = useState(false);
        const [transfFrom, setTransfFrom] = useState('pichincha');
        const [transfTo, setTransfTo] = useState('guayaquil');
        const [transfAmount, setTransfAmount] = useState("");

        // ESTADOS IGUALAR CAJA Y AUDITORÍA
        const [auditBank, setAuditBank] = useState(null);
        const [showEqualize, setShowEqualize] = useState(false);
        const [showAdjustments, setShowAdjustments] = useState(false);
        const [eqAmount, setEqAmount] = useState("");
        const [eqBank, setEqBank] = useState('pichincha');

        // ESTADO DE PERIODO CONTABLE (CORTES MENSUALES PARA LA CPA)
        const [selectedMonth, setSelectedMonth] = useState('all');

        // ---------------------------------------------------------
        // 1. CÁLCULOS DE CAJA REAL (BALANCE GLOBAL - NUNCA SE REINICIA)
        // ---------------------------------------------------------
        const balances = { pichincha: 0, guayaquil: 0, pacifico: 0, efectivo: 0 };
        logic.payments.forEach(p => { const acc = (p.account || 'pichincha').toLowerCase().trim(); const val = parseFloat(p.amount) || 0; if(balances[acc] !== undefined) balances[acc] += val; });
        logic.expenses.forEach(e => { const acc = (e.account || 'pichincha').toLowerCase().trim(); const val = parseFloat(e.amount) || 0; if(balances[acc] !== undefined) balances[acc] -= val; });
        const currentBalanceGlobal = balances.pichincha + balances.guayaquil + balances.pacifico + balances.efectivo;
        
        const totalReceivable = logic.clients.reduce((acc, c) => { const cy = logic.getClientCycle(c.id); return acc + (cy.clothingBalance < -0.01 ? Math.abs(cy.clothingBalance) : 0); }, 0); 

        // ---------------------------------------------------------
        // 2. EXTRAER MESES DISPONIBLES Y FILTRAR
        // ---------------------------------------------------------
        const availableMonths = useMemo(() => {
            const months = new Set();
            const addMonth = (dateStr) => {
                if(!dateStr) return;
                const m = dateStr.substring(0, 7); 
                if(m && m.length === 7) months.add(m);
            };
            logic.payments.forEach(p => addMonth(safeISO(p.date)));
            logic.expenses.forEach(e => addMonth(safeISO(e.date)));
            logic.sales.forEach(s => addMonth(safeISO(s.date)));
            return Array.from(months).sort().reverse(); 
        }, [logic.payments, logic.expenses, logic.sales]);

        const formatMonthName = (ym) => {
            if(ym === 'all') return 'HISTÓRICO TOTAL';
            const [y, m] = ym.split('-');
            const date = new Date(y, parseInt(m)-1, 1);
            return capitalizeFirst(date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
        };

        const filteredPayments = useMemo(() => logic.payments.filter(p => selectedMonth === 'all' || safeISO(p.date).startsWith(selectedMonth)), [logic.payments, selectedMonth]);
        const filteredExpenses = useMemo(() => logic.expenses.filter(e => selectedMonth === 'all' || safeISO(e.date).startsWith(selectedMonth)), [logic.expenses, selectedMonth]);
        const filteredSales = useMemo(() => logic.sales.filter(s => selectedMonth === 'all' || safeISO(s.date).startsWith(selectedMonth)), [logic.sales, selectedMonth]);

        // ---------------------------------------------------------
        // 3. ESTADÍSTICAS DEL PERIODO (ESTADO DE RESULTADOS)
        // ---------------------------------------------------------
        const partnerStats = useMemo(() => {
            const stats = {};
            filteredSales.forEach(s => {
                if (s.owner && s.owner !== 'me') {
                    if (!stats[s.owner]) stats[s.owner] = { sold: 0, paid: 0 };
                    stats[s.owner].sold += s.value;
                    if (s.partnerSettled) stats[s.owner].paid += s.value;
                }
            });
            return stats;
        }, [filteredSales]);

        const expensesBusiness = filteredExpenses.filter(e => e.category === 'business').reduce((acc, e) => acc + (parseFloat(e.amount)||0), 0);
        const expensesPersonal = filteredExpenses.filter(e => e.category === 'personal').reduce((acc, e) => acc + (parseFloat(e.amount)||0), 0);
        const expensesShipping = filteredExpenses.filter(e => e.category === 'shipping').reduce((acc, e) => acc + (parseFloat(e.amount)||0), 0);
        
        const ingresosRopa = filteredPayments.filter(p => !p.detail?.toLowerCase().includes("envío") && !p.detail?.toLowerCase().includes("transf") && !p.detail?.toLowerCase().includes("ajuste")).reduce((acc, p) => acc + (parseFloat(p.amount)||0), 0);
        const utilidadPura = ingresosRopa - expensesBusiness;

        const metrics = { totalCollected: filteredPayments.reduce((a,b)=>a+(parseFloat(b.amount)||0),0), totalExpenses: filteredExpenses.reduce((a,b)=>a+(parseFloat(b.amount)||0),0), profit: utilidadPura };

        // ---------------------------------------------------------
        // FUNCIONES
        // ---------------------------------------------------------
        const handleAddExpense = () => { if(!expDetail || !expAmount) return; logic.addExpense(expDetail, expAmount, expDate, expType, expAccount); setExpDetail(""); setExpAmount(""); };
        
        const handleTransfer = () => {
            if (!transfAmount || transfFrom === transfTo) return alert("Datos inválidos");
            const dateISO = new Date().toISOString();
            logic.addExpense(`Transf. a ${capitalizeFirst(transfTo)}`, transfAmount, dateISO, 'transfer_out', transfFrom);
            logic.addPayment('ADMIN_TRANSF', parseFloat(transfAmount), `Transf. desde ${capitalizeFirst(transfFrom)}`, dateISO, transfTo, { source: 'app_admin_transfer' });
            setTransfAmount(""); setShowTransfer(false); alert("✅ Transferencia Exitosa");
        };

        const handleEqualize = () => {
            if (!eqAmount) return;
            const realBalance = parseFloat(eqAmount);
            const currentSystemBalance = balances[eqBank] || 0;
            const difference = realBalance - currentSystemBalance;

            if (Math.abs(difference) < 0.01) return alert("La caja ya tiene ese valor. No hay nada que ajustar.");

            const dateISO = new Date().toISOString();
            if (difference > 0) {
                logic.addPayment('SISTEMA', difference, 'Ajuste Ingreso Fantasma', dateISO, eqBank, { source: 'app_admin_adjustment' });
            } else {
                logic.addExpense(`Ajuste Egreso Fantasma`, Math.abs(difference), dateISO, 'business', eqBank);
            }
            setEqAmount(""); setShowEqualize(false); 
            alert(`✅ Caja igualada con éxito.\nEl sistema generó un ajuste automático de $${difference.toFixed(2)} para cuadrar cuentas.`);
        };

        const adjustmentsList = useMemo(() => {
            const inAdj = logic.payments.filter(p => p.clientId === 'SISTEMA');
            const outAdj = logic.expenses.filter(e => e.detail.includes('Ajuste') && e.detail.includes('Fantasma'));
            return [...inAdj, ...outAdj].sort((a,b) => new Date(safeISO(b.date)) - new Date(safeISO(a.date)));
        }, [logic.payments, logic.expenses]);

        const handleDeleteAdjustment = async (item) => {
            if (!window.confirm("¿Borrar este ajuste fantasma?")) return;
            const col = item.clientId ? 'payments' : 'expenses';
            if (col === 'payments') await logic.deletePayment(item); else await logic.deleteExpense(item);
        };

        const handleDownloadCSV = () => { exportToCSV([['Fecha', 'Cliente', 'Item', 'Valor', 'Dueño'], ...filteredSales.map(s => [s.date.split('T')[0], s.clientId, s.item, s.value, s.owner || 'me'])], `Ventas_Adelita_${getToday()}.csv`); };
        const handleSaveEdit = async () => { if(!editingExp || !editingExp.fireId) return; await logic.updateExpense(editingExp, { detail: editingExp.detail, amount: parseFloat(editingExp.amount), date: safeISO(editingExp.date), category: editingExp.category, account: editingExp.account }); setEditingExp(null); };
        const deleteExpense = async () => { if(editingExp && confirm("¿Borrar?")) { await logic.deleteExpense(editingExp); setEditingExp(null); } };
        const sortedExpenses = [...filteredExpenses].sort((a,b) => new Date(safeISO(b.date)) - new Date(safeISO(a.date)));

        const auditData = useMemo(() => {
            if(!auditBank) return [];
            const p = logic.payments.filter(x => x.account === auditBank).map(x => ({...x, type: 'in'}));
            const e = logic.expenses.filter(x => x.account === auditBank).map(x => ({...x, type: 'out'}));
            return [...p, ...e].sort((a,b) => new Date(safeISO(b.date)) - new Date(safeISO(a.date)));
        }, [auditBank, logic.payments, logic.expenses]);

        const changeTransactionBank = async (item, newBank) => {
            try { await logic.moveMovementAccount(item, newBank); } catch(e) { alert("Error cambiando banco."); }
        };

        return (
            <div className="flex flex-col h-full bg-slate-50 relative overflow-hidden">
                {showReport && <ReportViewer logic={{...logic, sales: filteredSales, payments: filteredPayments, expenses: filteredExpenses}} metrics={metrics} onClose={() => setShowReport(false)} />}
                
                {/* MODALES BÁSICOS */}
                {showTransfer && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6" onClick={()=>setShowTransfer(false)}><div className="bg-white p-6 rounded-3xl w-full max-w-sm" onClick={e=>e.stopPropagation()}><h3 className="font-bold text-xl mb-4">Transferir Dinero</h3><div className="flex gap-2 mb-4"><select value={transfFrom} onChange={e=>setTransfFrom(e.target.value)} className="w-full p-2 border rounded font-bold"><option value="pichincha">Pichincha</option><option value="guayaquil">Guayaquil</option><option value="pacifico">Pacífico</option><option value="efectivo">Efectivo</option></select><span>➔</span><select value={transfTo} onChange={e=>setTransfTo(e.target.value)} className="w-full p-2 border rounded font-bold"><option value="pichincha">Pichincha</option><option value="guayaquil">Guayaquil</option><option value="pacifico">Pacífico</option><option value="efectivo">Efectivo</option></select></div><input type="number" value={transfAmount} onChange={e=>setTransfAmount(e.target.value)} className="w-full p-3 border rounded-xl font-bold text-xl mb-4" placeholder="$0.00" /><button onClick={handleTransfer} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">CONFIRMAR</button></div></div>)}
                {editingExp && (<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6" onClick={()=>setEditingExp(null)}><div className="bg-white p-6 rounded-3xl w-full max-w-sm space-y-3" onClick={e=>e.stopPropagation()}><div className="flex justify-between border-b pb-2"><h3 className="font-bold">Editar Gasto</h3><button onClick={deleteExpense} className="text-red-500 text-xs font-bold">Borrar</button></div><input value={editingExp.detail} onChange={e=>setEditingExp({...editingExp, detail: e.target.value})} className="w-full p-2 border rounded" /><div className="flex gap-2"><input type="number" value={editingExp.amount} onChange={e=>setEditingExp({...editingExp, amount: e.target.value})} className="w-full p-2 border rounded" /><input type="date" value={editingExp.date.split('T')[0]} onChange={e=>setEditingExp({...editingExp, date: e.target.value})} className="w-full p-2 border rounded" /></div><button onClick={handleSaveEdit} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">GUARDAR</button></div></div>)}
                
                {/* MODAL IGUALAR CAJA INTELIGENTE */}
                {showEqualize && (
                    <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 md:p-6" onClick={()=>setShowEqualize(false)}>
                        <div className="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl" onClick={e=>e.stopPropagation()}>
                            <h3 className="font-black text-xl mb-1 flex items-center gap-2">⚖️ Igualar Caja</h3>
                            <p className="text-xs text-slate-500 mb-4 leading-tight">Dile al sistema <b>cuánto dinero REAL tienes</b> en este momento. El sistema calculará la diferencia y lo ajustará solito.</p>
                            
                            <label className="text-[10px] font-bold text-slate-400 uppercase">1. Selecciona el Banco</label>
                            <select value={eqBank} onChange={e=>setEqBank(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold mb-3 mt-1 outline-none text-indigo-700">
                                {['pichincha', 'guayaquil', 'pacifico', 'efectivo'].map(b => <option key={b} value={b}>{capitalizeFirst(b)} (Actual: ${balances[b].toFixed(2)})</option>)}
                            </select>
                            
                            <label className="text-[10px] font-bold text-slate-400 uppercase">2. Escribe el saldo REAL (App de tu banco)</label>
                            <input type="number" value={eqAmount} onChange={e=>setEqAmount(e.target.value)} className="w-full p-4 bg-white border-2 border-indigo-100 focus:border-indigo-400 outline-none rounded-xl font-black text-2xl text-slate-700 mb-4 mt-1 text-center" placeholder="$ 0.00" />
                            
                            <button onClick={handleEqualize} className="w-full py-4 bg-slate-900 text-white font-black text-lg rounded-xl mb-3 shadow-lg active:scale-95 transition-all">APLICAR AJUSTE</button>
                            
                            <div className="border-t border-slate-100 pt-3">
                                <button onClick={()=>{setShowEqualize(false); setShowAdjustments(true);}} className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-xs transition-colors">¿Te equivocaste? Ver Historial de Ajustes</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL HISTORIAL DE AJUSTES FANTASMAS */}
                {showAdjustments && (
                    <div className="fixed inset-0 bg-black/80 z-[70] flex flex-col justify-end md:justify-center p-0 md:p-6 animate-in slide-in-from-bottom" onClick={()=>setShowAdjustments(false)}>
                        <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl" onClick={e=>e.stopPropagation()}>
                            <div className="p-5 border-b flex justify-between items-center bg-red-50 rounded-t-3xl">
                                <div>
                                    <h3 className="font-black text-red-700 text-lg uppercase flex items-center gap-2"><Icon.Alert /> Historial de Ajustes</h3>
                                    <p className="text-[10px] text-red-500 font-bold">Borra aquí los ajustes que hiciste por error.</p>
                                </div>
                                <button onClick={()=>setShowAdjustments(false)} className="font-bold text-red-400 text-xl bg-white w-8 h-8 rounded-full shadow-sm">✕</button>
                            </div>
                            <div className="overflow-y-auto p-4 flex-1 space-y-2">
                                {adjustmentsList.length === 0 && <div className="text-center text-slate-400 py-10 font-bold">No hay ajustes fantasmas registrados.</div>}
                                {adjustmentsList.map(adj => (
                                    <div key={adj.fireId} className="p-3 border border-slate-200 rounded-xl flex justify-between items-center shadow-sm">
                                        <div>
                                            <p className="font-bold text-sm text-slate-700">{adj.detail}</p>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase mt-0.5">{new Date(safeISO(adj.date)).toLocaleDateString()} • {adj.account}</p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`font-black text-lg ${adj.clientId ? 'text-emerald-600' : 'text-red-600'}`}>{adj.clientId ? '+' : '-'}${adj.amount.toFixed(2)}</span>
                                            <button onClick={()=>handleDeleteAdjustment(adj)} className="bg-red-50 hover:bg-red-100 text-red-600 p-2.5 rounded-lg active:scale-95 transition-all"><Icon.Trash/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL AUDITORÍA DE BANCO */}
                {auditBank && (
                    <div className="fixed inset-0 bg-black/80 z-[60] flex flex-col justify-end md:justify-center p-0 md:p-6" onClick={()=>setAuditBank(null)}>
                        <div className="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg max-h-[85vh] flex flex-col" onClick={e=>e.stopPropagation()}>
                            <div className="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl md:rounded-t-3xl">
                                <h3 className="font-black text-xl uppercase">Auditoría: {auditBank}</h3>
                                <button onClick={()=>setAuditBank(null)} className="font-bold text-slate-400 text-xl">✕</button>
                            </div>
                            <div className="overflow-y-auto p-4 flex-1 space-y-2">
                                {auditData.map(item => {
                                    const clientObj = item.clientId && item.clientId !== 'SISTEMA' && item.clientId !== 'ADMIN_TRANSF' ? logic.clients.find(c => c.id === item.clientId) : null;
                                    return (
                                        <div key={item.fireId} className={`p-3 border rounded-xl shadow-sm text-sm flex justify-between items-center ${item.type==='in' ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}`}>
                                            <div className="flex-1">
                                                <div className="font-bold">{item.detail}</div>
                                                {clientObj && <div className="text-[10px] font-black text-indigo-600 uppercase mt-0.5">👤 {clientObj.name} ({item.clientId})</div>}
                                                {!clientObj && item.clientId && item.clientId !== 'SISTEMA' && item.clientId !== 'ADMIN_TRANSF' && <div className="text-[10px] font-black text-indigo-600 uppercase mt-0.5">👤 {item.clientId}</div>}
                                                <div className="text-[10px] text-slate-500 mt-0.5">{new Date(safeISO(item.date)).toLocaleString()}</div>
                                                <select value={item.account} onChange={(e)=>changeTransactionBank(item, e.target.value)} className="text-[10px] p-1 mt-1 rounded border bg-white outline-none">
                                                    <option value="pichincha">Pichincha</option><option value="guayaquil">Guayaquil</option><option value="pacifico">Pacífico</option><option value="efectivo">Efectivo</option>
                                                </select>
                                            </div>
                                            <div className="flex flex-col items-end gap-2">
                                                <span className={`font-black ${item.type==='in'?'text-emerald-600':'text-red-600'}`}> {item.type==='in'?'+':'-'}${(item.amount||0).toFixed(2)}</span>
                                                {item.clientId && item.clientId !== 'SISTEMA' && item.clientId !== 'ADMIN_TRANSF' && (
                                                    <button onClick={() => { setAuditBank(null); onJumpToClient(item.clientId); }} className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200 shadow-sm active:scale-95">Ir al Perfil 🚀</button>
                                                )}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                )}

                {/* --- CABECERA FINANCIERA (Fondo sólido para reparar Safari iPad) --- */}
                <div className="bg-slate-900 p-4 pb-6 rounded-b-[2rem] shadow-xl text-white z-10 shrink-0 relative">
                    
                    <div className="absolute top-4 right-4 flex items-center gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700 shadow-lg z-20">
                        <label className="text-[9px] font-bold text-slate-400 uppercase tracking-widest hidden md:block pl-2">Periodo:</label>
                        <select 
                            value={selectedMonth} 
                            onChange={e=>setSelectedMonth(e.target.value)} 
                            className="bg-slate-700 text-white text-[10px] md:text-xs font-black px-2 py-1.5 rounded-lg outline-none cursor-pointer border border-slate-600 text-center"
                        >
                            <option value="all">TODO EL HISTÓRICO</option>
                            {availableMonths.map(m => ( <option key={m} value={m}>{formatMonthName(m)}</option> ))}
                        </select>
                    </div>

                    <div className="flex justify-between items-end mb-4 mt-12 md:mt-8">
                        <div>
                            <div className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-1"><Icon.Chart/> Utilidad {selectedMonth !== 'all' ? 'Del Mes' : 'Total'}</div>
                            <div className="text-4xl font-black text-emerald-300">${utilidadPura.toFixed(2)}</div>
                            <div className="text-[10px] text-slate-400 mt-1">Ingresos (${ingresosRopa.toFixed(2)}) - Gastos (${expensesBusiness.toFixed(2)})</div>
                        </div>
                        <div className="text-right space-y-1">
                            <div className="text-[10px] text-slate-400"><span className="text-orange-400 font-bold">Retiros:</span> -${expensesPersonal.toFixed(2)}</div>
                            <div className="text-[10px] text-slate-400"><span className="text-blue-400 font-bold">Courier:</span> -${expensesShipping.toFixed(2)}</div>
                            <button onClick={()=>setShowEqualize(true)} className="mt-2 text-[9px] bg-white/10 px-2 py-1 rounded font-bold hover:bg-white/20 active:scale-95 transition-all">⚖️ Igualar Caja</button>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-4 gap-2 pt-4 border-t border-white/10">
                        {['pichincha', 'guayaquil', 'pacifico', 'efectivo'].map(bank => ( <button key={bank} onClick={()=>setAuditBank(bank)} className="bg-white/5 p-2 rounded-xl text-center hover:bg-white/20 active:scale-95 transition-all"><div className={`text-[9px] uppercase ${bank==='pichincha'?'text-yellow-300':bank==='guayaquil'?'text-pink-300':bank==='pacifico'?'text-blue-300':'text-emerald-300'}`}>{bank}</div><div className="font-bold text-xs">${balances[bank].toFixed(2)}</div></button> ))}
                    </div>
                    <div className="mt-3 flex justify-between px-1 text-[10px] text-slate-400 font-bold"><span>Total Cajas Reales: ${currentBalanceGlobal.toFixed(2)}</span><span>Deuda Global: ${totalReceivable.toFixed(2)}</span></div>
                </div>

                {/* --- CUERPO --- */}
                <div className="flex-1 flex flex-col landscape:flex-row overflow-hidden">
                    <div className="flex-none landscape:w-1/2 overflow-y-auto p-4 space-y-3 bg-slate-50">
                        <AdelitaCoreControlPanel logic={logic} onJumpToClient={onJumpToClient} />
                        
                        {Object.keys(partnerStats).length > 0 && (
                            <div className="bg-purple-50 p-3 rounded-2xl shadow-sm border border-purple-100 mb-2">
                                <h3 className="font-bold text-purple-800 mb-2 flex items-center gap-2 text-xs uppercase tracking-wide"><Icon.Users /> Estado Socias {selectedMonth !== 'all' ? '(Mensual)' : ''}</h3>
                                <div className="space-y-2">
                                    {Object.entries(partnerStats).map(([partner, data]) => {
                                        const debt = data.sold - data.paid;
                                        return (
                                            <div key={partner} className="bg-white p-2 rounded-xl border border-purple-100 flex justify-between items-center text-xs shadow-sm">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-6 h-6 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-[10px]">{partner[0]}</div>
                                                    <div className="font-bold text-slate-700">{partner}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[9px] text-slate-400">Vendido: ${data.sold.toFixed(2)}</div>
                                                    <div className={`font-bold ${debt > 0.01 ? 'text-red-500' : 'text-emerald-500'}`}>
                                                        {debt > 0.01 ? `Pendiente: $${debt.toFixed(2)}` : '✅ Liquidado'}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-2">
                            <h3 className="font-bold text-slate-700 mb-2 flex items-center gap-2 text-xs uppercase tracking-wide"><Icon.List /> Zona de Reportes</h3>
                            <div className="flex gap-2">
                                <button onClick={() => setShowReport(true)} className="flex-1 py-3 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-xl font-bold flex flex-col items-center justify-center gap-1 hover:bg-indigo-100 transition-colors">
                                    <span className="text-lg">📊</span>
                                    <span className="text-[10px] text-center uppercase">VENTAS & DEUDAS<br/>{selectedMonth !== 'all' ? formatMonthName(selectedMonth) : ''}</span>
                                </button>
                                <button onClick={handleDownloadCSV} className="flex-1 py-3 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-xl font-bold flex flex-col items-center justify-center gap-1 hover:bg-emerald-100 transition-colors">
                                    <span className="text-lg">📥</span>
                                    <span className="text-[10px] text-center uppercase">EXCEL / CSV<br/>{selectedMonth !== 'all' ? formatMonthName(selectedMonth) : ''}</span>
                                </button>
                            </div>
                        </div>

                        <button onClick={() => setShowTransfer(true)} className="w-full py-3 bg-white text-slate-600 border border-slate-200 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-50 shadow-sm text-xs"><Icon.Zap /> TRANSFERIR ENTRE CUENTAS</button>

                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-700 mb-3 flex items-center gap-2 text-sm"><Icon.Tag /> Registrar Salida</h3>
                            <div className="flex bg-slate-100 p-1 rounded-xl mb-3"><button onClick={() => setExpType('business')} className={`flex-1 py-2 rounded-lg text-[10px] font-bold ${expType === 'business' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>🏢 NEGOCIO</button><button onClick={() => setExpType('personal')} className={`flex-1 py-2 rounded-lg text-[10px] font-bold ${expType === 'personal' ? 'bg-orange-500 shadow text-white' : 'text-slate-400'}`}>😎 MÍO</button></div>
                            <div className="flex gap-2 mb-2"><input value={expDetail} onChange={e => setExpDetail(e.target.value)} placeholder="Detalle (Ej: Luz)" className="flex-1 p-2 bg-slate-50 border rounded-xl text-xs" /><input type="number" step="0.01" value={expAmount} onChange={e => setExpAmount(e.target.value)} placeholder="$" className="w-20 p-2 bg-slate-50 border rounded-xl font-bold text-xs" /></div>
                            <div className="flex gap-2 items-center"><select value={expAccount} onChange={e => setExpAccount(e.target.value)} className="w-24 p-2 bg-indigo-50 border border-indigo-100 rounded-xl text-[10px] font-bold text-indigo-800"><option value="pichincha">Pichincha</option><option value="guayaquil">Guayaquil</option><option value="pacifico">Pacífico</option><option value="efectivo">Efectivo</option></select><button onClick={handleAddExpense} className={`flex-1 py-2 rounded-xl font-bold text-white shadow-lg text-xs ${expType === 'business' ? 'bg-slate-800' : 'bg-orange-500'}`}>REGISTRAR</button></div>
                        </div>
                    </div>

                    <div className="flex-1 landscape:w-1/2 overflow-y-auto p-4 pt-0 landscape:pt-4 border-t landscape:border-t-0 landscape:border-l border-slate-200">
                        <div className="sticky top-0 bg-slate-50 py-2 flex justify-between items-center border-b border-slate-200 mb-2">
                            <h3 className="text-[10px] font-bold text-slate-400 uppercase">Gastos y Salidas</h3>
                            <span className="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded">{selectedMonth !== 'all' ? formatMonthName(selectedMonth) : 'Todos'}</span>
                        </div>
                        <div className="space-y-2 pb-20">
                            {sortedExpenses.map(e => (<div key={e.id} onClick={() => setEditingExp(e)} className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer hover:scale-[1.02] ${e.category === 'transfer_out' ? 'bg-indigo-50 border-indigo-100 opacity-70' : (e.category === 'personal' ? 'bg-orange-50 border-orange-100' : 'bg-white border-slate-100')}`}><div className="flex items-center gap-3"><div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${e.category === 'personal' ? 'bg-orange-100 text-orange-500' : 'bg-slate-100 text-slate-500'}`}>{e.category === 'personal' ? '😎' : (e.category === 'transfer_out' ? '💱' : '🏢')}</div><div className="overflow-hidden"><div className={`font-bold text-xs truncate ${e.category === 'personal' ? 'text-orange-800' : 'text-slate-700'}`}>{e.detail}</div><div className="text-[9px] text-slate-400">{new Date(safeISO(e.date)).toLocaleDateString()}</div></div></div><div className={`font-bold text-xs ${e.category === 'personal' ? 'text-orange-600' : 'text-slate-600'}`}>-${e.amount.toFixed(2)}</div></div>))}
                            {sortedExpenses.length === 0 && <p className="text-center text-slate-400 text-xs py-8">No hay gastos registrados en este periodo.</p>}
                        </div>
                    </div>
                </div>
            </div>
        );
    };


    // --- APP PRINCIPAL — ADELITA STORE 2.0 NUEVA GEN. 🧬 ---
        const App = () => {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [tab, setTab] = useState('live'); 
        
        // 1. TELETRANSPORTADOR GLOBAL
        const [jumpId, setJumpId] = useState(null);

        useEffect(() => {
            if(window.fbAuth) {
                window.fbAuth.onAuthStateChanged(window.auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
            } else {
                 setTimeout(() => setLoading(false), 2000);
            }
        }, []);

        const logic = useBusinessLogic(user);

        // FUNCIÓN MÁGICA DE SALTO
        const handleJump = (clientId) => {
            setJumpId(clientId);
            setTab('clients');
        };

        if (loading) return <div className="h-screen flex items-center justify-center text-slate-400 font-bold">Cargando...</div>;
        if (!user) return <LoginView onLogin={setUser} />;

        return (
            <div className="h-screen flex flex-col landscape:flex-row bg-[#f0f2f5] overflow-hidden font-sans">
                <div className={`newgen-chip ${logic.coreStatus?.online ? 'newgen-online' : logic.coreStatus?.legacyOnline ? 'newgen-hybrid' : 'newgen-offline'}`}>🧬 {logic.coreStatus?.online ? '2.0 Core' : logic.coreStatus?.legacyOnline ? '2.0 Híbrido' : '2.0 Respaldo'}</div>
                <div className="flex-1 overflow-hidden relative order-1 landscape:order-2">
                    {tab === 'live' && <LiveView logic={logic} />}
                    {tab === 'warehouse' && <WarehouseView logic={logic} onJumpToClient={handleJump} />}
                    {tab === 'clients' && <ClientsView logic={logic} jumpId={jumpId} setJumpId={setJumpId} />}
                    {tab === 'admin' && <AdminView logic={logic} onClose={() => setTab('live')} onJumpToClient={handleJump} />}
                </div>
                <div className="bg-white border-t landscape:border-t-0 landscape:border-r border-slate-200 px-6 py-2 pb-6 md:pb-2 flex landscape:flex-col justify-around items-center z-50 shadow-2xl order-2 landscape:order-1 landscape:w-24 landscape:py-4 landscape:h-full">
                    <button onClick={() => setTab('live')} className={`flex flex-col items-center p-3 rounded-2xl transition-all duration-300 ${tab === 'live' ? 'text-pink-600 bg-pink-50 scale-110 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Icon.Zap /><span className="text-[10px] font-black mt-1 tracking-wider">LIVE</span></button>
                    <button onClick={() => setTab('warehouse')} className={`flex flex-col items-center p-3 rounded-2xl transition-all duration-300 ${tab === 'warehouse' ? 'text-indigo-600 bg-indigo-50 scale-110 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Icon.Box /><span className="text-[10px] font-black mt-1 tracking-wider">BODEGA</span></button>
                    <button onClick={() => setTab('clients')} className={`flex flex-col items-center p-3 rounded-2xl transition-all duration-300 ${tab === 'clients' ? 'text-emerald-600 bg-emerald-50 scale-110 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Icon.Users /><span className="text-[10px] font-black mt-1 tracking-wider">CLIENTES</span></button>
                    <button onClick={() => setTab('admin')} className={`flex flex-col items-center p-3 rounded-2xl transition-all duration-300 ${tab === 'admin' ? 'text-slate-800 bg-slate-100 scale-110 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Icon.Chart /><span className="text-[10px] font-black mt-1 tracking-wider">GERENCIA</span></button>
                </div>
            </div>
        );
    };


    window.initReactApp = () => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    };

    if(window.firebaseLoaded) window.initReactApp();

</script>

</body>
</html>
